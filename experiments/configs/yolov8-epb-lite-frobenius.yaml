# YOLOv8-EPB-Lite-Frobenius (R9 control): same as Lite-SVD, pooling = ||A||_F of the 3x3 window (L2 pooling, no SVD).
nc: 5

backbone:
  - [-1, 1, EfficientNetBackbone, ["b0"]]                    # 0: [P2, P3, P4, P5]

head:
  - [0, 1, PoolBiFPN, [96, 2, "frobenius", "b0", "strict"]]    # 1: [P2, P3, P4, P5] x 96
  - [1, 1, Index, [96, 1]]                                   # 2: P3
  - [1, 1, Index, [96, 2]]                                   # 3: P4
  - [1, 1, Index, [96, 3]]                                   # 4: P5
  - [[2, 3, 4], 1, Detect, [nc]]                             # 5
